<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank - Sign In</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Left Side: Logos -->
        <div class="left-side">
            <div class="logo-group">
                <img src="mybankicon.png" alt="Bank Icon" class="bank-icon">
                <img src="mybanktext.png" alt="My Bank Logo" class="text-logo">
            </div>
        </div>

        <!-- Right Side: Register Form -->
        <div class="right-side">
            <h2>Sign In</h2>
            <form>
                <div class="input-group">
                    <label for="new-userid">User ID</label>
                    <input type="text" id="new-userid" placeholder="Create your User ID" required>
                </div>
                
                <div class="input-group">
                    <label for="new-password">Password</label>
                    <input type="password" id="new-password" placeholder="Create your Password" required>
                </div>

                <!-- 🔥 Puthusa Confirm Password field -->
                <div class="input-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Confirm your Password" required>
                </div>

                <!-- Rendu button-um -->
                <div class="button-group">
                    <button type="submit" class="login-btn">Submit</button>
                    <!-- 🔥 Login click panna thirumba index.html ku varum -->
                    <button type="button" class="signin-btn" onclick="window.location.href='index.html'">Login</button>
                </div>
            </form>
        </div>

    </div>

</body>
</html>
