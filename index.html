<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bank - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        
        <!-- Left Side: Logos -->
        <div class="left-side">
            <!-- Icon and Text otti otti iruka -->
            <div class="logo-group">
                <img src="mybankicon.png" alt="Bank Icon" class="bank-icon">
                <img src="mybanktext.png" alt="My Bank Logo" class="text-logo">
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="right-side">
            <h2>Login</h2>
            <form>
                <div class="input-group">
                    <label for="userid">User ID</label>
                    <input type="text" id="userid" placeholder="Enter your User ID" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your Password" required>
                </div>

                <!-- Oru Login button mattum irukanum -->
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>

    </div>

</body>
</html>
